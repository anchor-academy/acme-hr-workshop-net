# Render Blueprint: New -> Blueprint -> pick this repo.
# One free web service runs the API and serves the web app at /app, so there is no CORS and no second host.
services:
  - type: web
    name: acme-hr
    runtime: docker
    dockerfilePath: ./src/Api/Dockerfile
    dockerContext: .
    plan: free
    region: singapore
    healthCheckPath: /health
    autoDeploy: false          # deploys only through the deploy hook, after CI passes on main
    envVars:
      - key: DATABASE_URL
        sync: false            # your Lab 4 Render Postgres: Connect -> Internal Database URL
      - key: ANTHROPIC_API_KEY
        sync: false
