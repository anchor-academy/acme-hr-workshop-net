# Render Blueprint: New -> Blueprint -> this repo. Everything on Render's free plan, region Singapore.
databases:
  - name: acme-hr-db
    plan: free
    region: singapore
    databaseName: acmehr
    user: acmehr

services:
  - type: web
    name: acme-hr-api
    runtime: docker
    dockerfilePath: ./src/Api/Dockerfile
    dockerContext: .
    plan: free
    region: singapore
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: acme-hr-db, property: connectionString }
      - key: AllowedOrigins
        fromService: { name: acme-hr-web, type: web, property: host }
      - key: ANTHROPIC_API_KEY
        sync: false

  - type: web
    name: acme-hr-web
    runtime: static
    rootDir: web
    buildCommand: npm ci && NEXT_OUTPUT=export npm run build
    staticPublishPath: out
    envVars:
      - key: NEXT_PUBLIC_API_URL
        fromService: { name: acme-hr-api, type: web, property: host }
