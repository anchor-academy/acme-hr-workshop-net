# Render Blueprint: New -> Blueprint -> this repo. Free plan, region Singapore.
# One web service runs the API and serves the web app at /app. One free Postgres database.
databases:
  - name: acme-hr-db
    plan: free
    region: singapore
    databaseName: acmehr
    user: acmehr

services:
  - type: web
    name: acme-hr
    runtime: docker
    dockerfilePath: ./src/Api/Dockerfile
    dockerContext: .
    plan: free
    region: singapore
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: acme-hr-db, property: connectionString }
      - key: ANTHROPIC_API_KEY
        sync: false
