name: deploy
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
jobs:
  deploy-api:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger Render deploy
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then echo "::warning::RENDER_DEPLOY_HOOK not set, skipping API deploy"; exit 0; fi
          curl -fsS -X POST "$HOOK"
# The web app deploys through Vercel's Git integration (production on main, a preview for every pull request).
