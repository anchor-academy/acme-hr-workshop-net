name: claude-review
on:
  pull_request:
permissions:
  contents: read
  pull-requests: write
jobs:
  claude-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10                 # time limit
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Check secret
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::ANTHROPIC_API_KEY secret is missing. Add it in Settings > Secrets and variables > Actions."
            exit 1
          fi
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code
      - name: Review the pull request (headless)
        run: |
          git diff origin/${{ github.base_ref }}...HEAD > pr.diff
          PROMPT="You are reviewing a pull request for Acme HR (.NET API + Next.js). The diff is in pr.diff; read changed files for context.
          Check only: (1) new or changed logic without tests, (2) obvious bugs, (3) secrets or personal data in the diff.
          Write a short review in markdown with file and line for each finding.
          The LAST line must be exactly 'VERDICT: PASS' if there are no findings of type 1, 2 or 3, otherwise 'VERDICT: FAIL'."
          claude -p "$PROMPT" \
            --output-format json \
            --max-turns 5 \
            --allowedTools "Read,Grep,Glob" > review.json
      - name: Post review, record cost, enforce verdict
        run: |
          RESULT=$(jq -r '.result' review.json)
          COST=$(jq -r '.total_cost_usd // "n/a"' review.json)
          TURNS=$(jq -r '.num_turns // "n/a"' review.json)
          printf "%s\n\n_Claude review · turns: %s · cost: US\$%s_\n" "$RESULT" "$TURNS" "$COST" > comment.md
          gh pr comment ${{ github.event.pull_request.number }} --body-file comment.md
          echo "### Claude review: turns $TURNS, cost US\$$COST" >> "$GITHUB_STEP_SUMMARY"
          echo "$RESULT" | tail -1 | grep -q "VERDICT: PASS" || { echo "::error::Claude review verdict is FAIL"; exit 1; }
